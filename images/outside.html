<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    ```html
<!-- ================= VIDEO SHOWCASE SECTION ================= -->
<section class="video-showcase">
  <div class="video-container">

    <video
      class="showcase-video"
      autoplay
      muted
      loop
      playsinline
      controls
      poster="poster.jpg">
      <source src="video.mp4" type="video/mp4">
      Your browser does not support HTML5 video.
    </video>

    <!-- Dark overlay -->
    <div class="video-overlay"></div>

    <!-- Text over video -->
    <div class="video-content">
      <span class="video-label">KAHUNGA DIGITAL</span>

      <h2>Bringing Digital Ideas to Life</h2>

      <p>
        Discover our digital solutions, creative designs and technology
        services designed to help businesses grow online.
      </p>

      <a href="#learn-more" class="video-btn">
        Learn More <span>→</span>
      </a>
    </div>

  </div>
</section>

<style>
/* ================= VIDEO SHOWCASE ================= */

.video-showcase {
  width: 100%;
  padding: 70px 20px;
  background: #050505;
  box-sizing: border-box;
}

.video-container {
  position: relative;
  width: 100%;
  max-width: 1200px;
  height: 600px;
  margin: auto;
  overflow: hidden;
  border-radius: 25px;
  background: #000;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
}

.showcase-video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* Overlay */
.video-overlay {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(
      90deg,
      rgba(0, 0, 0, 0.85) 0%,
      rgba(0, 0, 0, 0.55) 45%,
      rgba(0, 0, 0, 0.15) 100%
    );
  pointer-events: none;
}

/* Content */
.video-content {
  position: absolute;
  top: 50%;
  left: 7%;
  transform: translateY(-50%);
  max-width: 600px;
  color: white;
}

.video-label {
  display: inline-block;
  margin-bottom: 15px;
  padding: 8px 16px;
  border: 1px solid rgba(255,255,255,0.4);
  border-radius: 50px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 2px;
}

.video-content h2 {
  margin: 0 0 18px;
  font-size: clamp(40px, 5vw, 68px);
  line-height: 1.05;
  font-weight: 800;
}

.video-content p {
  margin: 0 0 30px;
  max-width: 520px;
  font-size: 18px;
  line-height: 1.7;
  color: rgba(255,255,255,0.85);
}

/* Button */
.video-btn {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 14px 24px;
  border-radius: 50px;
  background: white;
  color: #111;
  text-decoration: none;
  font-weight: 700;
  transition: 0.3s ease;
}

.video-btn span {
  font-size: 22px;
  transition: 0.3s ease;
}

.video-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 30px rgba(255,255,255,0.2);
}

.video-btn:hover span {
  transform: translateX(5px);
}

/* ================= MOBILE ================= */

@media (max-width: 768px) {

  .video-showcase {
    padding: 40px 15px;
  }

  .video-container {
    height: 520px;
    border-radius: 18px;
  }

  .video-overlay {
    background:
      linear-gradient(
        0deg,
        rgba(0,0,0,0.9) 0%,
        rgba(0,0,0,0.45) 65%,
        rgba(0,0,0,0.15) 100%
      );
  }

  .video-content {
    left: 25px;
    right: 25px;
    top: auto;
    bottom: 35px;
    transform: none;
  }

  .video-content h2 {
    font-size: 38px;
  }

  .video-content p {
    font-size: 15px;
    line-height: 1.5;
  }
}
</style>
```

</body>
</html>
